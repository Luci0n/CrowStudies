<script>
(function(){
  "use strict";

  /* ================= THEORY ENGINE ================= */
  var LETTERS = ['C','D','E','F','G','A','B'];
  var NATURAL_PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  var MAJOR_INTERVALS = [0,2,4,5,7,9,11];
  var MINOR_INTERVALS = [0,2,3,5,7,8,10];
  var ROMAN = ['I','II','III','IV','V','VI','VII'];
  var DEGREE_NAMES_MAJOR = ['Tonic','Supertonic','Mediant','Subdominant','Dominant','Submediant','Leading Tone'];
  var DEGREE_NAMES_MINOR = ['Tonic','Supertonic','Mediant','Subdominant','Dominant','Submediant','Subtonic'];
  var MODE_NAMES = ['Ionian','Dorian','Phrygian','Lydian','Mixolydian','Aeolian','Locrian'];
  var MODE_DESC = [
    'The major scale: bright, resolved, and at home.',
    'Minor with a lifted 6th. It feels moody without being heavy, and shows up in funk and jazz.',
    'Minor with a lowered 2nd. It has a dark sound common in flamenco and metal.',
    'Major with a raised 4th. It feels dreamy and floating.',
    'Major with a lowered 7th. Think blues and rock anthems.',
    'Natural minor: sad, grounded, and the default minor sound.',
    'Minor with a lowered 2nd and 5th. It is unstable and rarely feels like home.'
  ];

  var ROOT_DEFS = [
    ['C','C',0],['G','G',0],['D','D',0],['A','A',0],['E','E',0],['B','B',0],
    ["F♯",'F',1],["D♭",'D',-1],["A♭",'A',-1],["E♭",'E',-1],["B♭",'B',-1],['F','F',0]
  ];
  var ROOTS = ROOT_DEFS.map(function(d){
    return { label:d[0], letter:d[1], acc:d[2], pc:((NATURAL_PC[d[1]] + d[2]) % 12 + 12) % 12 };
  });

  function normAcc(diff){
    var d = ((diff % 12) + 12) % 12;
    if (d > 6) d -= 12;
    return d;
  }
  function accSymbol(a){ return a > 0 ? '♯'.repeat(a) : (a < 0 ? '♭'.repeat(-a) : ''); }
  function noteName(n){ return n.letter + accSymbol(n.acc); }

  function buildScale(rootIndex, scaleType){
    var root = ROOTS[rootIndex];
    var intervals = scaleType === 'major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
    var startIdx = LETTERS.indexOf(root.letter);
    var notes = [];
    for (var i=0; i<7; i++){
      var targetPc = ((root.pc + intervals[i]) % 12 + 12) % 12;
      var letter = LETTERS[(startIdx + i) % 7];
      notes.push({ letter:letter, acc:normAcc(targetPc - NATURAL_PC[letter]), pc:targetPc, semi:intervals[i], degree:i+1 });
    }
    return notes;
  }

  function triadsForScale(scaleArr){
    var S = scaleArr.map(function(n){ return n.semi; });
    var S2 = S.concat(S.map(function(s){ return s+12; }));
    var out = [];
    for (var i=0; i<7; i++){
      var third = S2[i+2]-S2[i], fifth = S2[i+4]-S2[i], quality;
      if (third===4 && fifth===7) quality='major';
      else if (third===3 && fifth===7) quality='minor';
      else if (third===3 && fifth===6) quality='diminished';
      else if (third===4 && fifth===8) quality='augmented';
      else quality='other';
      var roman = (quality==='major'||quality==='augmented') ? ROMAN[i] : ROMAN[i].toLowerCase();
      if (quality==='diminished') roman += '°';
      if (quality==='augmented') roman += '+';
      out.push({
        roman:roman, quality:quality, degree:i+1,
        notes:[scaleArr[i], scaleArr[(i+2)%7], scaleArr[(i+4)%7]],
        midiOffsets:[S2[i], S2[i+2], S2[i+4]]
      });
    }
    return out;
  }

  /* ================= AUDIO ================= */
  var audioCtx = null, master = null;
  function masterOut(ctx){
    if (!master){ master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination); }
    return master;
  }
  function ensureCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }

  /* Recorded piano samples are preloaded immediately. */
  var PIANO_SAMPLE_BASE = 'https://tonejs.github.io/audio/salamander/';
  var pianoBuffers = {}, pianoSamplesLoading = false, pianoSamplesReady = false;
  var PIANO_SAMPLE_FILES = { 60:'C4.mp3', 63:'Ds4.mp3', 66:'Fs4.mp3', 69:'A4.mp3' };
  function updatePianoSoundStatus(){
    var status = document.getElementById('pianoSoundStatus');
    if (status) status.textContent = pianoSamplesReady ? 'Grand-piano sound ready.' : 'Loading grand-piano sound…';
  }
  function loadPianoSamples(ctx){
    if (pianoSamplesLoading || pianoSamplesReady) return;
    pianoSamplesLoading = true;
    Promise.all(Object.keys(PIANO_SAMPLE_FILES).map(function(midi){
      return fetch(PIANO_SAMPLE_BASE + PIANO_SAMPLE_FILES[midi])
        .then(function(response){ if (!response.ok) throw new Error('sample unavailable'); return response.arrayBuffer(); })
        .then(function(data){ return ctx.decodeAudioData(data); })
        .then(function(buffer){ pianoBuffers[+midi] = buffer; });
    })).then(function(){ pianoSamplesReady = true; updatePianoSoundStatus(); }).catch(function(){
      pianoSamplesLoading = false;
      var status = document.getElementById('pianoSoundStatus');
      if (status) status.textContent = 'Piano sound could not load. Check your connection and try again.';
    });
  }
  function schedulePianoSample(ctx, midi, startTime, duration){
    if (!pianoSamplesReady) return false;
    var choices = Object.keys(pianoBuffers).map(Number);
    var sourceMidi = choices.reduce(function(best, candidate){ return Math.abs(candidate-midi) < Math.abs(best-midi) ? candidate : best; }, choices[0]);
    var source = ctx.createBufferSource();
    source.buffer = pianoBuffers[sourceMidi];
    source.playbackRate.value = Math.pow(2, (midi-sourceMidi)/12);
    var gain = ctx.createGain(), life = Math.max(1.35, duration + 0.9);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.82, startTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + life);
    source.connect(gain); gain.connect(masterOut(ctx));
    source.start(startTime); source.stop(startTime + life + 0.04);
    return true;
  }

  var noiseBuffer = null;
  function getNoiseBuffer(ctx){
    if (noiseBuffer) return noiseBuffer;
    var len = Math.floor(ctx.sampleRate * 0.06);
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for (var i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    return noiseBuffer;
  }

  // Additive piano-ish voice: slightly stretched harmonic partials, each with
  // its own decay, plus a short filtered noise burst for the hammer strike.
  var PARTIALS = [
    { ratio:1.000, amp:1.00, decay:1.00 }, { ratio:2.001, amp:0.55, decay:0.85 },
    { ratio:3.005, amp:0.30, decay:0.68 }, { ratio:4.012, amp:0.17, decay:0.52 },
    { ratio:5.023, amp:0.10, decay:0.40 }, { ratio:6.039, amp:0.06, decay:0.30 }
  ];

  function scheduleTone(ctx, midi, startTime, duration){
    loadPianoSamples(ctx);
    if (!schedulePianoSample(ctx, midi, startTime, duration)) return;
    var freq = midiToFreq(midi);
    var dur = duration * Math.max(0.55, Math.min(1.5, 1.55 - (midi-48)/48));

    var voice = ctx.createGain();
    voice.gain.value = 0.9;
    var tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.setValueAtTime(Math.min(9000, freq*9 + 1200), startTime);
    tone.frequency.exponentialRampToValueAtTime(Math.max(600, freq*2), startTime + dur);
    tone.Q.value = 0.4;
    tone.connect(voice);
    voice.connect(masterOut(ctx));

    PARTIALS.forEach(function(p){
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * p.ratio;
      var g = ctx.createGain();
      var partialDur = Math.max(0.12, dur * p.decay);
      g.gain.setValueAtTime(0.0001, startTime);
      g.gain.exponentialRampToValueAtTime(0.30 * p.amp, startTime + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + partialDur);
      osc.connect(g); g.connect(tone);
      osc.start(startTime);
      osc.stop(startTime + partialDur + 0.05);
    });

    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer(ctx);
    var nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.value = Math.min(6000, freq*3);
    nf.Q.value = 0.8;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.16, startTime);
    ng.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.045);
    noise.connect(nf); nf.connect(ng); ng.connect(voice);
    noise.start(startTime);
    noise.stop(startTime + 0.06);
  }

  // Single notes stack, so you can hold a chord one key at a time. Anything that
  // plays a phrase of its own -- a chord button, a progression -- takes over the
  // output, so starting a second one cuts the first instead of layering on it.
  var stepTimers = [];
  function stopPlayback(){
    stepTimers.forEach(clearTimeout);
    stepTimers = [];
    if (!audioCtx || !master) return;
    var leaving = master, now = audioCtx.currentTime;
    leaving.gain.cancelScheduledValues(now);
    leaving.gain.setValueAtTime(Math.max(0.0001, leaving.gain.value), now);
    leaving.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    setTimeout(function(){ try{ leaving.disconnect(); }catch(e){} }, 160);
    master = null;
  }
  function playMidis(midis, opts){
    opts = opts || {};
    if (opts.exclusive) stopPlayback();
    var ctx = ensureCtx(), now = ctx.currentTime + 0.02;
    midis.forEach(function(m, i){ scheduleTone(ctx, m, now + i*(opts.strum||0), opts.duration||1.0); });
  }
  function playSequence(groups, stepMs, onStep){
    stopPlayback();
    var ctx = ensureCtx(), now = ctx.currentTime + 0.05;
    groups.forEach(function(g, idx){
      (Array.isArray(g) ? g : [g]).forEach(function(m){
        scheduleTone(ctx, m, now + idx*(stepMs/1000), (stepMs/1000)*0.9);
      });
      if (onStep) stepTimers.push(setTimeout(function(){ onStep(idx); }, idx*stepMs));
    });
  }

  /* ================= KEYBOARD ================= */
  var WHITE_PCS = [0,2,4,5,7,9,11];
  var BLACK_PCS = { 0:1, 1:3, 3:6, 4:8, 5:10 };

  function metrics(){
    var w = window.innerWidth || 1000;
    if (w < 420) return { whiteW:40, blackW:26 };
    if (w < 560) return { whiteW:46, blackW:30 };
    return { whiteW:58, blackW:36 };
  }

  function renderKeyboard(el, highlightFn, onPlay, size){
    if (typeof el === 'string') el = document.getElementById(el);
    if (!el) return null;
    el.innerHTML = '';
    var m = size || metrics();
    WHITE_PCS.forEach(function(pc, i){
      var info = highlightFn(pc) || {};
      var k = document.createElement('div');
      k.className = 'wkey' + (info.inScale?' in-scale':'') + (info.isRoot?' is-root':'');
      k.style.width = m.whiteW + 'px';
      k.dataset.pc = pc;
      var lab = document.createElement('span');
      lab.className = 'lab';
      lab.textContent = LETTERS[i];
      k.appendChild(lab);
      if (info.badge){
        var b = document.createElement('span');
        b.className = 'kbadge';
        b.textContent = info.badge;
        k.appendChild(b);
      }
      k.addEventListener('click', function(){ onPlay(pc, k); });
      el.appendChild(k);
    });
    Object.keys(BLACK_PCS).forEach(function(key){
      var idx = +key, pc = BLACK_PCS[idx];
      var info = highlightFn(pc) || {};
      var k = document.createElement('div');
      k.className = 'bkey' + (info.inScale?' in-scale':'') + (info.isRoot?' is-root':'');
      k.style.width = m.blackW + 'px';
      k.style.left = (idx*m.whiteW + m.whiteW - m.blackW/2 - 2) + 'px';
      k.dataset.pc = pc;
      if (info.badge){
        var b = document.createElement('span');
        b.className = 'kbadge';
        b.textContent = info.badge;
        k.appendChild(b);
      }
      k.addEventListener('click', function(e){ e.stopPropagation(); onPlay(pc, k); });
      el.appendChild(k);
    });
    return el;
  }

  function flashKey(container, pc){
    if (typeof container === 'string') container = document.getElementById(container);
    if (!container) return;
    var n = container.querySelector('[data-pc="'+pc+'"]');

  function pianoMetrics(){ var white = Math.max(22, Math.min(42, Math.floor(((window.innerWidth || 1000) - 42) / 14))); return { whiteW:white, blackW:Math.round(white*.62) }; }
  function flashPianoMidi(midi){
    var node = document.querySelector('#pianoKeyboard [data-midi="'+midi+'"]');
    if (!node) return;
    node.classList.add('pressed');
    setTimeout(function(){ node.classList.remove('pressed'); }, 180);
  }
  function renderPianoKeyboard(){
    var root = document.getElementById('pianoKeyboard');
    if (!root) return;
    root.innerHTML = '';
    [48,60].forEach(function(base){
      var keyboard = document.createElement('div');
      keyboard.className = 'keyboard piano-octave';
      root.appendChild(keyboard);
      renderKeyboard(keyboard, function(){ return null; }, function(pc){
        var midi = base + pc;
        playMidis([midi], { duration:1.25 });
        flashPianoMidi(midi);
      }, pianoMetrics());
      Array.prototype.forEach.call(keyboard.querySelectorAll('[data-pc]'), function(node){
        var midi = base + (+node.dataset.pc);
        node.dataset.midi = midi;
        var offset = midi - computerPianoBase;
        if (COMPUTER_PIANO_LABELS[offset]){
          var hint = document.createElement('span');
          hint.className = 'keyhint';
          hint.textContent = COMPUTER_PIANO_LABELS[offset];
          node.appendChild(hint);
        }
      });
    });

  var COMPUTER_PIANO_KEYS = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };
  var COMPUTER_PIANO_LABELS = { 0:'A',1:'W',2:'S',3:'E',4:'D',5:'F',6:'T',7:'G',8:'Y',9:'H',10:'U',11:'J',12:'K' };
  var computerPianoBase = 60;
  var computerPianoBound = false;
  function bindComputerPiano(){
    if (computerPianoBound) return;
    computerPianoBound = true;
    window.addEventListener('keydown', function(event){
      if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
      if (!document.querySelector('#lesson-piano.active')) return;
      if (event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
      var key = String(event.key || '').toLowerCase();
      if (key === 'z'){
        computerPianoBase = 48;
        renderPianoKeyboard();
        event.preventDefault();
        return;
      }
      if (key === 'x'){
        computerPianoBase = 60;
        renderPianoKeyboard();
        event.preventDefault();
        return;
      }
      var offset = COMPUTER_PIANO_KEYS[key];
      if (offset == null) return;
      var midi = computerPianoBase + offset;
      event.preventDefault();
      playMidis([midi], { duration:1.25 });
      flashPianoMidi(midi);
    });
  }

  /* ================= QUESTION GENERATORS ================= */
  function randInt(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=randInt(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function choiceSet(correct, pool, count){
    var p = pool.filter(function(d){ return d!==correct; });
    shuffle(p);
    var all = p.slice(0, count-1).concat([correct]);
    shuffle(all);
    return { choices:all, correctIndex:all.indexOf(correct) };
  }
  function randRoot(){ return randInt(ROOTS.length); }
  function randType(){ return Math.random()<0.5 ? 'major' : 'minor'; }

  function genStepType(scaleType){
    var st = scaleType || randType();
    var iv = st==='major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
    var i = randInt(7);
    var next = i<6 ? iv[i+1] : 12;
    var set = choiceSet((next - iv[i])===1 ? 'Half step' : 'Whole step', ['Whole step','Half step'], 2);
    return { type:'mcq', tag: st==='major'?'Major scale':'Minor scale',
      headline:'Between scale notes ' + (i+1) + ' and ' + (i===6?'the next root':i+2) + ': how far?',
      choices:set.choices, correctIndex:set.correctIndex,
      explain: st==='major'
        ? 'Major has half steps between its 3rd–4th and 7th–next-root notes. Everywhere else is a whole step.'
        : 'Natural minor has half steps between its 2nd–3rd and 5th–6th notes. Everywhere else is a whole step.' };
  }

  function genKeyboardStepType(){
    var examples = [
      { from:'C', to:'C♯', answer:'Half step' },
      { from:'C', to:'D', answer:'Whole step' }
    ];
    var x = examples[randInt(examples.length)];
    var set = choiceSet(x.answer, ['Whole step','Half step'], 2);
    return { type:'mcq', tag:'Step sizes',
      headline:x.from + ' to ' + x.to + ': whole step or half step?',
      choices:set.choices, correctIndex:set.correctIndex,
      explain:x.answer === 'Half step'
        ? 'There is no key between ' + x.from + ' and ' + x.to + ', so it is a half step.'
        : 'There is one key between ' + x.from + ' and ' + x.to + ', so it is a whole step.' };
  }

  function demoProgression(rootIndex, degrees, label){
    var wrap = document.createElement('div');
    wrap.className = 'demo';
    var triads = triadsForScale(buildScale(rootIndex, 'major'));
    var blocks = document.createElement('div');
    blocks.className = 'row';
    degrees.forEach(function(d, i){
      var b = document.createElement('div');
      b.className = 'blk';
      b.dataset.idx = i;
      b.textContent = triads[d].roman;
      blocks.appendChild(b);
    });
    wrap.appendChild(blocks);
    var row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '14px';
    var play = document.createElement('button');
    play.className = 'btn sm';
    play.textContent = 'Hear ' + label;
    play.onclick = function(){
      playSequence(degrees.map(function(d){
        return triads[d].midiOffsets.map(function(o){ return 60 + ROOTS[rootIndex].pc + o; });
      }), 800, function(i){
        Array.prototype.forEach.call(blocks.children, function(c){ c.classList.remove('on'); });
        var n = blocks.querySelector('[data-idx="'+i+'"]');
        if (n) n.classList.add('on');
      });
    };
    row.appendChild(play);
    wrap.appendChild(row);
    return wrap;
  }

  function demoModes(rootIndex){
    var wrap = document.createElement('div');
    wrap.className = 'demo';
    var parent = buildScale(rootIndex, 'major');
    var row = document.createElement('div');
    row.className = 'row';
    [0,5].forEach(function(k){
      var tonic = parent[k];
      var b = document.createElement('button');
      b.className = 'btn ghost sm';
      b.textContent = MODE_NAMES[k] + ' on ' + noteName(tonic);
      b.onclick = function(){
        var seq = [], rootMidi = 60 + tonic.pc;
        for (var j=0;j<7;j++){
          seq.push(rootMidi + (((parent[(k+j)%7].semi - tonic.semi) + 12) % 12));
        }
        seq.push(rootMidi+12);
        playSequence(seq, 280);
      };
      row.appendChild(b);
    });
    wrap.appendChild(row);
    var c = document.createElement('p');
    c.className = 'cap';
    c.textContent = 'Identical notes, different home. One sounds major, one sounds minor.';
    wrap.appendChild(c);
    return wrap;
  }

    var done = false;
    renderKeyboard(kb, function(){ return null; }, function(pc, node){
      if (done) return;
      playMidis([60+pc]);
      if (onKey(pc, node, kb, function(ok){ done = true; api.finish(ok); })) done = true;
    });
    return kb;
  }

  var TYPES = {
    scaleBuild: function(area, q, api){
      var slots = document.createElement('div');
      slots.className = 'slots';
      q.sequence.forEach(function(){
        var s = document.createElement('div');
        s.className = 'slot';
        s.textContent = '·';
        slots.appendChild(s);
      });
      area.appendChild(slots);
      var at = 0;
      keyboardQuestion(area, q, api, function(pc, node, kb, finish){
        if (pc === q.sequence[at]){
          node.classList.add('hit-good');
          var slot = slots.children[at];
          slot.textContent = q.noteNames[at];
          slot.className = 'slot on';
          at++;
          if (at === q.sequence.length){
            var ascending = [], previous = -Infinity;
            q.sequence.forEach(function(notePc){
              var midi = 60 + notePc;
              while (midi <= previous) midi += 12;
              ascending.push(midi);
              previous = midi;
            });
            ascending.push(ascending[0] + 12);
            var listening = document.createElement('p');
            listening.className = 'cap';
            listening.textContent = 'Listen to the full scale…';
            area.appendChild(listening);
            playSequence(ascending, 260, function(i){ flashKey(kb, q.sequence[i % q.sequence.length]); });
            setTimeout(function(){ finish(true); }, ascending.length * 260 + 100);
            return true;
          }
          return false;
        }
        node.classList.add('flash-bad');
        for (var i=at;i<q.sequence.length;i++){
          slots.children[i].textContent = q.noteNames[i];
          slots.children[i].className = 'slot ' + (i===at ? 'miss' : 'reveal');
        }
        finish(false);
        return true;
      });
    },

    degreeFind: function(area, q, api){
      keyboardQuestion(area, q, api, function(pc, node, kb, finish){
        if (pc === q.targetPc){ node.classList.add('hit-good'); finish(true); return true; }
        node.classList.add('flash-bad');
        var right = kb.querySelector('[data-pc="'+q.targetPc+'"]');
        if (right) right.classList.add('hit-good');
        finish(false);
        return true;
      });
    },

    chordSpot: function(area, q, api){
      var stack = document.createElement('div');
      stack.className = 'chord-stack';
      stack.innerHTML = '<span class="stack-label">Build it as a stack</span>'
        + q.stack.map(function(note, i){ return '<span class="stack-note n'+i+'">'+note+(i===0?' <small>root</small>':i===1?' <small>3rd</small>':' <small>5th</small>')+'</span>'; }).reverse().join('')
        + '<span class="stack-caption">Read bottom to top: root, third, fifth. The top note can be in the next octave.</span>';
      area.appendChild(stack);
      var hit = [];
      keyboardQuestion(area, q, api, function(pc, node, kb, finish){
        if (hit.indexOf(pc) >= 0) return false;
        if (q.targetPcs.indexOf(pc) >= 0){
          hit.push(pc);
          node.classList.add('hit-good');
          if (hit.length === q.targetPcs.length){ finish(true); return true; }
          return false;
        }
        node.classList.add('flash-bad');
        q.targetPcs.forEach(function(t){
          var n = kb.querySelector('[data-pc="'+t+'"]');
          if (n) n.classList.add('hit-good');
        });
        finish(false);
        return true;
      });
    }
  };

  /* ================= LESSONS (reference screen) ================= */
  var lessonState = { rootIndex:0, scaleType:'major', tab:'scale', custom:[] };

  function buildLessons(root){
    root.innerHTML = ''
      + '<div class="learnbar">'
      +   '<select class="pill" id="rootSelect" aria-label="Key"></select>'
      +   '<button class="pill active" data-scale="major">Major</button>'
      +   '<button class="pill" data-scale="minor">Minor</button>'
      + '</div>'
      + '<div class="lesson-nav"><div class="lessontabs" id="lessonTabs"></div></div>'
      + '<div class="lesson" id="lesson-piano">'
      +   '<div class="piano-stage"><div class="piano-stage-top"><button class="btn ghost sm" id="closePiano">Lessons</button><p id="pianoSoundStatus">Loading grand-piano sound…</p></div>'
      +     '<div class="piano-canvas"><div id="pianoKeyboard"></div></div>'
      +     '<div class="piano-shortcuts" aria-label="Computer piano keys"><span>A–K plays the highlighted octave · Z / X changes octave</span>'
      +       '<kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd><kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd><kbd>K</kbd></div>'
      +     '<p class="sample-credit">Piano samples: <a href="https://github.com/sfzinstruments/SalamanderGrandPiano" target="_blank" rel="noopener">Salamander Grand Piano</a> by Alexander Holm (CC BY 3.0).</p>'
      +   '</div>'
      + '</div>'
      + '<div class="lesson active" id="lesson-scale">'
      +   '<div class="card"><h2>A scale is a step recipe</h2>'
      +     '<p>Seven notes are spaced by whole steps (2 keys) and half steps (1 key). Use the same recipe from any starting note and you get the same flavour in a new key. That is all a key change is.</p>'
      +     '<div class="kbwrap"><div class="keyboard" id="scaleKeyboard"></div></div>'
      +     '<p class="spell" id="spellingLine" style="margin-top:14px"></p>'
      +     '<div class="progrow" style="margin-top:14px"><button class="btn" id="playScaleBtn">Play it</button></div>'
      +   '</div>'
      +   '<div class="card"><h2>Where the half steps land</h2>'
      +     '<p><strong>Major:</strong> after degree 3 and after degree 7. <strong>Natural minor:</strong> after degree 2 and after degree 5. The gaps are the same, but they start in a different place. That is the major/minor split.</p>'
      +   '</div>'
      + '</div>'
      + '<div class="lesson" id="lesson-degrees">'
      +   '<div class="card"><h2>Each degree has a job</h2>'
      +     '<p>Number the notes 1–7 and every position inherits a role. The number travels between keys; the letter does not. Tap a row to hear it.</p>'
      +     '<div class="deglist" id="degList"></div>'
      +   '</div>'
      + '</div>'
      + '<div class="lesson" id="lesson-chords">'
      +   '<div class="card"><h2>Stack every other note</h2>'
      +     '<p>Take a note, skip one, take the next, skip one, take the next. Do that from all seven degrees and the key hands you seven chords for free. Tap one to hear it.</p>'
      +     '<div class="kbwrap" style="margin-bottom:14px"><div class="keyboard" id="chordKeyboard"></div></div>'
      +     '<div class="chordgrid" id="chordGrid"></div>'
      +   '</div>'
      + '</div>'
      + '<div class="lesson" id="lesson-harmony">'
      +   '<div class="card"><h2>Tension, then release</h2>'
      +     '<p><strong>I</strong> is home. <strong>V</strong> holds the leading tone a half step under home, so it pulls hardest back. <strong>IV</strong> leans more gently. <strong>vi</strong> shares two notes with I.</p>'
      +     '<div class="progrow" id="presetRow"></div><div class="blocks" id="presetBlocks"></div>'
      +   '</div>'
      +   '<div class="card"><h2>Build your own</h2>'
      +     '<p>Tap chords in the order you want them, then play it back.</p>'
      +     '<div class="progrow" id="chipRow"></div><div class="blocks" id="customBlocks"></div>'
      +     '<div class="progrow" style="margin-top:14px"><button class="btn" id="playCustomBtn">Play progression</button>'
      +     '<button class="btn ghost" id="clearCustomBtn">Clear</button></div>'
      +   '</div>'
      + '</div>'
      + '<div class="lesson" id="lesson-modes">'
      +   '<div class="card"><h2>Same notes, seven ways home</h2>'
      +     '<p>Keep one major scale’s notes and start from a different member of the set. New tonic, new mood. Natural minor is just the one starting on degree 6.</p>'
      +     '<div id="modeList"></div>'
      +   '</div>'
      + '</div>';

    var sel = root.querySelector('#rootSelect');
    ROOTS.forEach(function(r, i){
      var o = document.createElement('option');
      o.value = i; o.textContent = r.label;
      sel.appendChild(o);
    });
    sel.value = lessonState.rootIndex;
    sel.onchange = function(){ lessonState.rootIndex = +sel.value; renderLessons(); };

    root.querySelectorAll('.learnbar .pill[data-scale]').forEach(function(b){
      b.onclick = function(){
        if (lessonState.scaleType === b.dataset.scale) return;
        root.querySelectorAll('.learnbar .pill[data-scale]').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        lessonState.scaleType = b.dataset.scale;
        renderLessons();
      };
    });

    var TABS = [['scale','Scales'],['degrees','Degrees'],['chords','Chords'],['harmony','Harmony'],['modes','Modes']];
    var tabsEl = root.querySelector('#lessonTabs');
    function selectLessonTab(id){
      lessonState.tab = id;
      drawTabs();
      TABS.concat([['piano','Piano']]).forEach(function(x){
        root.querySelector('#lesson-'+x[0]).classList.toggle('active', x[0]===lessonState.tab);
      });
      root.querySelector('.learnbar').hidden = id==='piano';
      root.querySelector('.lesson-nav').hidden = id==='piano';
      var courseTabs = document.querySelector('.screen[data-screen="extra"] [data-f="extraCourseTabs"]');
      if (courseTabs) courseTabs.hidden = id==='piano';
    }
    function drawTabs(){
      tabsEl.innerHTML = '';
      TABS.forEach(function(t){
        var b = document.createElement('button');
        b.className = 'pill' + (lessonState.tab===t[0] ? ' active' : '');
        b.textContent = t[1];
        b.onclick = function(){ selectLessonTab(t[0]); };
        tabsEl.appendChild(b);
      });
    }
    window.CrowMusicOpenPiano = function(){ selectLessonTab('piano'); };
    root.querySelector('#closePiano').onclick = function(){ selectLessonTab('scale'); };
    selectLessonTab(lessonState.tab);
    renderLessons();

    var timer = null;
    window.addEventListener('resize', function(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        if (document.getElementById('scaleKeyboard')) renderLessons();
      }, 180);
    });
  }

  function lessonScale(){ return buildScale(lessonState.rootIndex, lessonState.scaleType); }
  function lessonRootMidi(){ return 60 + ROOTS[lessonState.rootIndex].pc; }

  function renderLessons(){
    var scale = lessonScale();
    var st = lessonState.scaleType;

    /* piano */
    renderPianoKeyboard();
    bindComputerPiano();
    updatePianoSoundStatus();

    /* scales */
    var map = {}; scale.forEach(function(n){ map[n.pc] = n; });
    renderKeyboard('scaleKeyboard', function(pc){
      var n = map[pc];
      return n ? { inScale:true, isRoot:n.degree===1, badge:String(n.degree) } : null;
    }, function(pc){ playMidis([60+pc]); flashKey('scaleKeyboard', pc); });

    var accCount = scale.filter(function(n){ return n.acc!==0; }).length;
    document.getElementById('spellingLine').textContent =
      ROOTS[lessonState.rootIndex].label + ' ' + (st==='major'?'major':'natural minor') + ':  ' +
      scale.map(noteName).join('  ') + '   ·  ' +
      (accCount===0 ? 'no sharps or flats' : accCount + (accCount===1?' accidental':' accidentals'));

    document.getElementById('playScaleBtn').onclick = function(){
      var midis = scale.map(function(n){ return lessonRootMidi() + n.semi; });
      midis.push(lessonRootMidi()+12);
      var pcs = scale.map(function(n){ return n.pc; }); pcs.push(scale[0].pc);
      playSequence(midis, 320, function(i){ flashKey('scaleKeyboard', pcs[i]); });
    };

    /* degrees */
    var names = st==='major' ? DEGREE_NAMES_MAJOR : DEGREE_NAMES_MINOR;
    var list = document.getElementById('degList');
    list.innerHTML = '';
    scale.forEach(function(n, i){
      var row = document.createElement('button');
      row.className = 'degrow';
      row.innerHTML = '<span class="n">'+(i+1)+'</span><span class="nm">'+noteName(n)+'</span><span class="fn">'+names[i]+'</span>';
      row.onclick = function(){ playMidis([lessonRootMidi() + n.semi], {duration:1.2}); };
      list.appendChild(row);
    });

    /* chords */
    var triads = triadsForScale(scale);
    function setChordKeys(t){
      var m = {};
      t.notes.forEach(function(n, i){ m[n.pc] = { inScale:true, isRoot:i===0, badge: i===0?'R':(i===1?'3':'5') }; });
      renderKeyboard('chordKeyboard', function(pc){ return m[pc] || null; }, function(pc){
        playMidis([60+pc]); flashKey('chordKeyboard', pc);
      });
    }
    setChordKeys(triads[0]);
    var grid = document.getElementById('chordGrid');
    grid.innerHTML = '';
    triads.forEach(function(t){
      var card = document.createElement('button');
      card.className = 'chordbtn';
      card.innerHTML = '<span class="qual '+t.quality+'">'+t.quality+'</span>'
        + '<span class="rn">'+t.roman+'</span>'
        + '<span class="nt">'+t.notes.map(noteName).join(' · ')+'</span>';
      card.onclick = function(){
        playMidis(t.midiOffsets.map(function(o){ return lessonRootMidi()+o; }), {strum:0.02, duration:1.4, exclusive:true});
        setChordKeys(t);
      };
      grid.appendChild(card);
    });

    /* harmony */
    function drawBlocks(id, seq, onRemove){
      var el = document.getElementById(id);
      el.innerHTML = '';
      if (!seq.length){
        var p = document.createElement('span');
        p.style.cssText = 'color:var(--ink-3);font-size:15px';
        p.textContent = id==='customBlocks' ? 'Nothing queued yet.' : 'Pick one above.';
        el.appendChild(p);
        return;
      }
      seq.forEach(function(t, i){
        var b = document.createElement(onRemove ? 'button' : 'div');
        b.className = 'blk';
        b.dataset.idx = i;
        b.textContent = t.roman;
        if (onRemove) b.onclick = function(){ onRemove(i); };
        el.appendChild(b);
      });
    }
    function light(id, i){
      var el = document.getElementById(id);
      Array.prototype.forEach.call(el.children, function(c){ c.classList.remove('on'); });
      var n = el.querySelector('[data-idx="'+i+'"]');
      if (n) n.classList.add('on');
    }

    var presetRow = document.getElementById('presetRow');
    presetRow.innerHTML = '';
    PRESETS.forEach(function(p){
      var b = document.createElement('button');
      b.className = 'btn ghost sm';
      b.textContent = p.label;
      b.onclick = function(){
        var seq = p.degrees.map(function(d){ return triads[d]; });
        drawBlocks('presetBlocks', seq);
        playSequence(seq.map(function(t){ return t.midiOffsets.map(function(o){ return lessonRootMidi()+o; }); }),
          820, function(i){ light('presetBlocks', i); });
      };
      presetRow.appendChild(b);
    });
    drawBlocks('presetBlocks', []);

    var chipRow = document.getElementById('chipRow');
    chipRow.innerHTML = '';
    triads.forEach(function(t, i){
      var c = document.createElement('button');
      c.className = 'btn ghost sm';
      c.textContent = t.roman;
      c.onclick = function(){ lessonState.custom.push(i); drawCustom(); };
      chipRow.appendChild(c);
    });
    function drawCustom(){
      drawBlocks('customBlocks', lessonState.custom.map(function(i){ return triads[i]; }), function(i){
        lessonState.custom.splice(i,1); drawCustom();
      });
    }
    drawCustom();
    document.getElementById('playCustomBtn').onclick = function(){
      if (!lessonState.custom.length) return;
      var seq = lessonState.custom.map(function(i){ return triads[i]; });
      playSequence(seq.map(function(t){ return t.midiOffsets.map(function(o){ return lessonRootMidi()+o; }); }),
        820, function(i){ light('customBlocks', i); });
    };
    document.getElementById('clearCustomBtn').onclick = function(){ lessonState.custom = []; drawCustom(); };

    /* modes */
    var rootPc = ROOTS[lessonState.rootIndex].pc;
    var parentPc = st==='major' ? rootPc : (rootPc+3)%12;
    var parentIndex = 0;
    for (var i=0;i<ROOTS.length;i++){ if (ROOTS[i].pc===parentPc){ parentIndex=i; break; } }
    var parentMajor = buildScale(parentIndex, 'major');
    var modeList = document.getElementById('modeList');
    modeList.innerHTML = '';
    for (var k=0;k<7;k++){
      (function(kk){
        var tonic = parentMajor[kk];
        var row = document.createElement('div');
        row.className = 'moderow';
        row.innerHTML = '<span class="mn">'+MODE_NAMES[kk]+'</span>'
          + '<span class="mt">'+noteName(tonic)+'</span>'
          + '<span class="md">'+MODE_DESC[kk]+'</span>';
        var b = document.createElement('button');
        b.className = 'btn ghost sm';
        b.textContent = 'Play';
        b.onclick = function(){
          var seq = [], rootMidi = 60 + tonic.pc;
          for (var j=0;j<7;j++) seq.push(rootMidi + (((parentMajor[(kk+j)%7].semi - tonic.semi) + 12) % 12));
          seq.push(rootMidi+12);
          playSequence(seq, 290);
        };
        row.appendChild(b);
        modeList.appendChild(row);
      })(k);
    }
  }

  /* ================= GO ================= */
  CrowQuiz({
    backLink:{ href:'../lessons/', label:'All lessons' },
    course:'music',
    title:'Music theory',
    tagline:'Scales, chords, and harmony at the keyboard',
    logo:'<svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="3" y="4" width="6" height="20" rx="2" fill="#fff"/><rect x="11" y="4" width="6" height="20" rx="2" fill="#fff" opacity=".75"/><rect x="19" y="4" width="6" height="20" rx="2" fill="#fff" opacity=".5"/><rect x="6" y="4" width="4" height="12" rx="1.5" fill="var(--brand-shelf)"/><rect x="14" y="4" width="4" height="12" rx="1.5" fill="var(--brand-shelf)"/></svg>',
    units:UNITS,
    types:TYPES,
    sounds:{ correct:chime, wrong:buzz, fanfare:fanfare },
    showPracticePreview:false,
    unitPractice:true,
    unitPracticeCount:4,
    extra:{ label:'Lessons', title:'Lessons', build:buildLessons, asTab:true }
  }).start('#app');
  loadPianoSamples(ensureCtx());
  (function(){
    var hero = document.querySelector('.screen[data-screen="home"] .coursehero');
    if (!hero) return;
    var launch = document.createElement('button');
    launch.className = 'course-piano-launch';
    launch.type = 'button';
    launch.setAttribute('aria-label', 'Open piano');
    launch.title = 'Open piano';
    launch.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13v4M14 13v4M18 13v4M2 13h20M22 11.5A3.5 3.5 0 0 0 18.5 8a3.52 3.52 0 0 1-3.173-2A7 7 0 0 0 2 9v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2zM6 13v4"/></svg>';
    launch.onclick = function(){
      var lessons = document.querySelector('.course-tab[data-screen="extra"]');
      if (lessons) lessons.click();
      if (window.CrowMusicOpenPiano) window.CrowMusicOpenPiano();
    };
    hero.appendChild(launch);
  })();
})();
</script>
