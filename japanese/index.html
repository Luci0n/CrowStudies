<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese kana · CrowStudies</title>
<meta name="description" content="Learn all 46 hiragana and 46 katakana row by row, with mnemonics, practice, and help for look-alike characters.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=mobile-writing-20260910">
<style>
  .jp{ font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  .disc{ font-family:"Noto Sans JP","Space Grotesk",sans-serif; font-weight:500; font-size:26px; }

  .kanagrid{ display:grid; grid-template-columns:repeat(var(--cols,5),1fr); gap:10px; }
  .kanacard{
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    padding:12px 10px; text-align:center;
  }
  .kanacard .glyph{
    font-family:"Noto Sans JP",sans-serif; font-weight:500; font-size:46px; line-height:1.1;
    color:var(--ink); display:block;
  }
  .kanacard .romaji{
    display:block; font-family:"Space Grotesk",sans-serif; font-weight:650; font-size:19px;
    color:var(--brand); margin-top:2px;
  }
  .kanacard .mnem{ display:block; font-size:12.5px; color:var(--ink-3); margin-top:6px; line-height:1.35; }

  .bigkana{
    font-family:"Noto Sans JP",sans-serif; font-weight:500;
    font-size:110px; line-height:1; text-align:center;
    margin:6px 0 18px; color:var(--ink);
  }
  .choice.kana{ font-family:"Noto Sans JP",sans-serif; font-weight:500; font-size:40px; padding:14px; }

  .pairbox{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pairside{
    background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px; text-align:center;
  }
  .pairside .glyph{ font-family:"Noto Sans JP",sans-serif; font-size:54px; line-height:1.1; display:block; }
  .pairside .romaji{ font-family:"Space Grotesk",sans-serif; font-weight:650; font-size:20px; color:var(--brand); }
  .pairside .tell{ display:block; font-size:13px; color:var(--ink-3); margin-top:6px; line-height:1.35; }

  .writing{ background:var(--well); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .writerbox{ width:270px; max-width:100%; margin:0 auto; touch-action:none; }
  .writerbox svg{ display:block; width:100%; height:auto; }
  .writer-status{ min-height:22px; text-align:center; color:var(--ink-3); font-size:14px; font-weight:700; margin:8px 0 0; }
  .writer-actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .writer-actions .btn{ width:auto; padding:11px 15px; font-size:14px; }

  @media (max-width:560px){
    .bigkana{ font-size:88px; }
    .kanagrid{ grid-template-columns:repeat(3,1fr); gap:8px; }
    .kanacard .glyph{ font-size:40px; }
    .kanacard .mnem{ font-size:12px; }
    .writerbox{ width:250px; }
  }
</style>
</head>
<body>

<header class="sitehead">
  <div class="inner">
    <a class="wordmark" href="../">
      <span class="wordmark-icon" aria-hidden="true"></span>
      CrowStudies
    </a>
    <nav class="sitenav">
      <a href="../lessons/" aria-current="page">Lessons</a>
      <a href="../studio/">Studio</a>
      <button class="authbtn auth-pending" data-firebase-auth disabled>Sign in</button>
    </nav>
  </div>
</header>

<div id="app"></div>

<script type="module" src="../assets/firebase.js?v=20260909-32"></script>

<script>
(function(){
  "use strict";

  /* ================= KANA DATA =================
     k = the character, r = romaji answer, a = accepted spellings,
     m = a mnemonic for the shape. Wāpuro-style alternatives (si, ti,
     tu, hu) are accepted because that is what people type on a JP IME. */
  function c(k, r, m, alts){ return { k:k, r:r, m:m, a:alts || [r] }; }

  var HIRA = {
    a:  [c('あ','a','An Apple with a cross through its core.'),
         c('い','i','Two eels swimming side by side: ii.'),
         c('う','u','A person with a big nose going "ooh".'),
         c('え','e','An exotic bird: beak on top, feet below.'),
         c('お','o','あ with a golf ball flying off the tee.')],
    ka: [c('か','ka','A kite with its tail streaming behind.'),
         c('き','ki','A key with two teeth.'),
         c('く','ku','A cuckoo\'s open beak.'),
         c('け','ke','A keg with a handle on the left.'),
         c('こ','ko','Two coins lying flat.')],
    sa: [c('さ','sa','A fishing rod that just caught a sardine.'),
         c('し','shi','A single hook. It swings low and up.', ['shi','si']),
         c('す','su','A swing with a loop hanging under it.'),
         c('せ','se','A table set for one: fork, knife, plate.'),
         c('そ','so','A zigzag sewing stitch.')],
    ta: [c('た','ta','A tall man carrying a stick: t plus a.'),
         c('ち','chi','A cheerleader bending backwards.', ['chi','ti']),
         c('つ','tsu','A tsunami wave curling over.', ['tsu','tu']),
         c('て','te','A hand hanging down off a table edge.'),
         c('と','to','A toe with a splinter stuck in it.')],
    na: [c('な','na','A nun kneeling beside a cross.'),
         c('に','ni','A needle and thread: two knees.'),
         c('ぬ','nu','Noodles twirled onto a fork.'),
         c('ね','ne','A cat with a curled tail: neko.'),
         c('の','no','A no-entry spiral.')],
    ha: [c('は','ha','The letter H wearing a hat: HA!'),
         c('ひ','hi','A wide smiling mouth going "hee".'),
         c('ふ','fu','Mount Fuji seen from the side.', ['fu','hu']),
         c('へ','he','A small flat hill.'),
         c('ほ','ho','は with an extra bar, like a house with a chimney.')],
    ma: [c('ま','ma','A mama with two arms and a bow in her hair.'),
         c('み','mi','A curl and a tail, like the number 21: mi.'),
         c('む','mu','A cow\'s face going "muu".'),
         c('め','me','An eye with a lash. Me means eye.'),
         c('も','mo','A fishhook with two worms on it.')],
    ya: [c('や','ya','A yak with one horn out to the side.'),
         c('ゆ','yu','A fish caught on a hook.'),
         c('よ','yo','A yo-yo on its string.')],
    ra: [c('ら','ra','A rabbit sitting up on its back legs.'),
         c('り','ri','Two reeds standing in a river.'),
         c('る','ru','A route that ends in a loop.'),
         c('れ','re','A person leaning back, relaxed.'),
         c('ろ','ro','A road that bends, like る without the loop.')],
    wa: [c('わ','wa','A swan gliding on water.'),
         c('を','wo','A person throwing a boomerang.', ['wo','o']),
         c('ん','n','A lowercase n stretched out long.', ['n','nn'])]
  };

  var KATA = {
    a:  [c('ア','a','An axe head, blade to the left.'),
         c('イ','i','An eagle\'s beak pointing down.'),
         c('ウ','u','A roof with a nose under it.'),
         c('エ','e','An I-beam, or elevator doors.'),
         c('オ','o','A person throwing their arms up: "oh!"')],
    ka: [c('カ','ka','A knife cutting downward.'),
         c('キ','ki','A key with two teeth, like き without the loop.'),
         c('ク','ku','A beak, cut short at the top left.'),
         c('ケ','ke','A keg lid, propped open.'),
         c('コ','ko','A corner bracket.')],
    sa: [c('サ','sa','A cactus standing in sand.'),
         c('シ','shi','Two marks on the LEFT, stroke sweeps UP.', ['shi','si']),
         c('ス','su','A ski slope with a jump.'),
         c('セ','se','A set square, with the same shape as せ.'),
         c('ソ','so','One mark at the TOP, stroke comes DOWN.')],
    ta: [c('タ','ta','A knife over a tie.'),
         c('チ','chi','A wedge of cheese on a stick.', ['chi','ti']),
         c('ツ','tsu','Three marks on TOP, stroke comes DOWN.', ['tsu','tu']),
         c('テ','te','A telephone pole with two wires.'),
         c('ト','to','A totem pole with one arm.')],
    na: [c('ナ','na','A knife crossing a post: "nah".'),
         c('ニ','ni','Two lines: ni means two.'),
         c('ヌ','nu','Noodles crossed on a plate.'),
         c('ネ','ne','A cat sitting by a church cross.'),
         c('ノ','no','A single slash: no.')],
    ha: [c('ハ','ha','Two legs apart, laughing HA HA.'),
         c('ヒ','hi','The heel of a shoe.'),
         c('フ','fu','A bare hook, like ワ with the left side gone.', ['fu','hu']),
         c('ヘ','he','The same small hill as へ.'),
         c('ホ','ho','A Christmas tree: ho ho ho.')],
    ma: [c('マ','ma','A mother\'s arm holding a baby.'),
         c('ミ','mi','Three strokes. Mi means three.'),
         c('ム','mu','An open mouth going "muu".'),
         c('メ','me','Crossed eyes. Me means eye.'),
         c('モ','mo','More branches on the same hook.')],
    ya: [c('ヤ','ya','A yacht\'s sail on its mast.'),
         c('ユ','yu','A U-shape lying on its side.'),
         c('ヨ','yo','Three prongs, like a rack of yo-yos.')],
    ra: [c('ラ','ra','A llama\'s head and neck.'),
         c('リ','ri','Two strokes, just like り.'),
         c('ル','ru','Two legs running.'),
         c('レ','re','A single check mark.'),
         c('ロ','ro','A box, like a road block.')],
    wa: [c('ワ','wa','A wide open mouth, wider than ク.'),
         c('ヲ','wo','A rack; you will barely ever write it.', ['wo','o']),
         c('ン','n','Two marks LOW, stroke sweeps UP from the left.', ['n','nn'])]
  };

  function rows(set, keys){ return keys.map(function(k){ return set[k]; }); }
  function flat(list){ return list.reduce(function(a,r){ return a.concat(r); }, []); }
  var ALL_HIRA = flat(rows(HIRA, ['a','ka','sa','ta','na','ha','ma','ya','ra','wa']));
  var ALL_KATA = flat(rows(KATA, ['a','ka','sa','ta','na','ha','ma','ya','ra','wa']));

  /* ================= SOUND ================= */
  var ctx = null;
  function ac(){
    if (!ctx){ var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function blip(freq, at, dur, type, vol){
    var a = ac();
    var o = a.createOscillator(), g = a.createGain();

    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(a.destination);
    o.start(at); o.stop(at + dur + 0.03);
  }
  var UI_SFX = {
    correct:'../assets/sfx/confirm.wav',
    wrong:'../assets/sfx/error.wav',
    complete:'../assets/sfx/complete.wav'
  };
  function playUiSfx(kind){
    var sound = new Audio(UI_SFX[kind]);
    sound.volume = kind === 'wrong' ? 0.38 : 0.48;
    sound.play().catch(function(){});
  }
  function chime(){ playUiSfx('correct'); }
  function buzz(){ playUiSfx('wrong'); }
  function fanfare(){ playUiSfx('complete'); }

  /* ================= GENERATORS ================= */
  function randInt(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=randInt(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function pick(pool){ return pool[randInt(pool.length)]; }
  function distractors(field, correct, pool, count){
    var seen = {}, out = [];
    shuffle(pool.slice()).forEach(function(x){
      if (out.length >= count) return;
      if (x[field] === correct || seen[x[field]]) return;
      seen[x[field]] = 1;
      out.push(x[field]);
    });
    return out;
  }
  function assemble(correct, others){
    var all = shuffle(others.concat([correct]));
    return { choices:all, correctIndex:all.indexOf(correct) };
  }
  function scriptName(pool){ return pool === ALL_KATA ? 'Katakana' : 'Hiragana'; }

  function cycle(pool, make){
    var order=[], index=0;
    return function(){
      if (index >= order.length){ order=shuffle(pool.slice()); index=0; }
      return make(order[index++]);
    };
  }

  /* read the kana, choose the romaji */
  function readQuestion(ch, wide){
    var set = assemble(ch.r, distractors('r', ch.r, wide, 3));
    return { type:'mcq',
      tag:'Read it',
      headlineHtml:'<span class="jp" style="font-size:1.05em">' + ch.k + '</span>',
      sub:'Which sound is this?',
      choices:set.choices, correctIndex:set.correctIndex,
      speech:{text:ch.k,lang:'ja-JP',rate:0.78}, explain: ch.k + ' is “' + ch.r + '”. ' + ch.m };
  }
  function readGen(pool, wide){ return function(){ return readQuestion(pick(pool), wide); }; }
  function fullReadGen(pool, wide){ return cycle(pool, function(ch){ return readQuestion(ch, wide); }); }

  /* read the romaji, choose the kana */
  function writeQuestion(ch, wide){
    var set = assemble(ch.k, distractors('k', ch.k, wide, 3));
    return { type:'mcq', tag:'Find it',
      headline:'Which one is “' + ch.r + '”?',
      choices:set.choices, correctIndex:set.correctIndex, bigChoices:true,
      speech:{text:ch.k,lang:'ja-JP',rate:0.78}, explain:'“' + ch.r + '” is ' + ch.k + '. ' + ch.m };
  }
  function writeGen(pool, wide){ return function(){ return writeQuestion(pick(pool), wide); }; }
  function fullWriteGen(pool, wide){ return cycle(pool, function(ch){ return writeQuestion(ch, wide); }); }

  /* type the romaji */
  function typeQuestion(ch){
    return { type:'type', tag:'Type it',
      headlineHtml:'<span class="jp" style="font-size:1.05em">' + ch.k + '</span>',
      sub:'Type the sound in romaji.',
      answer:ch.r, alts:ch.a, placeholder:'e.g. ka',
      speech:{text:ch.k,lang:'ja-JP',rate:0.78}, explain: ch.k + ' is “' + ch.r + '”. ' + ch.m };
  }
  function typeGen(pool){ return function(){ return typeQuestion(pick(pool)); }; }
  function fullTypeGen(pool){ return cycle(pool, typeQuestion); }

  /* ================= TEACHING CARDS ================= */
  function hearKana(ch){ var b=document.createElement('button'); b.className='speakbtn'; b.type='button'; b.textContent='Hear'; b.setAttribute('aria-label','Hear '+ch.r); b.onclick=function(){ CrowSpeak(ch.k,'ja-JP',0.78); }; return b; }
  function kanaGrid(list){
    var wrap = document.createElement('div');
    wrap.className = 'demo';
    var grid = document.createElement('div');
    grid.className = 'kanagrid';
    grid.style.setProperty('--cols', Math.min(list.length, 5));
    list.forEach(function(ch){
      var card = document.createElement('div');
      card.className = 'kanacard';
      card.innerHTML = '<span class="glyph">' + ch.k + '</span>'
        + '<span class="romaji">' + ch.r + '</span>'
        + '<span class="mnem">' + ch.m + '</span>';
      card.appendChild(hearKana(ch));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function pairCard(a, b, note){
    var wrap = document.createElement('div');
    wrap.className = 'demo';
    var box = document.createElement('div');
    box.className = 'pairbox';
    [a,b].forEach(function(ch){
      var side = document.createElement('div');
      side.className = 'pairside';
      side.innerHTML = '<span class="glyph">' + ch.k + '</span>'
        + '<span class="romaji">' + ch.r + '</span>'
        + '<span class="tell">' + ch.m + '</span>';
      side.appendChild(hearKana(ch));
      box.appendChild(side);
    });
    wrap.appendChild(box);
    if (note){
      var p = document.createElement('p');
      p.className = 'cap';
      p.textContent = note;
      wrap.appendChild(p);
    }
    return wrap;
  }

  function find(pool, k){
    for (var i=0;i<pool.length;i++){ if (pool[i].k === k) return pool[i]; }
    return null;
  }

  /* ================= UNITS ================= */
  var ROW_TITLES = {
    a:'The vowels', ka:'The k row', sa:'The s row', ta:'The t row', na:'The n row',
    ha:'The h row', ma:'The m row', ya:'The y row', ra:'The r row', wa:'The last three'
  };
  var ROW_BODY = {
    a:'Everything else is built on these five vowel sounds, always in this order: a, i, u, e, o. Learn the order now and every chart afterwards makes sense.',
    ka:'Each row is a consonant plus those same five vowels. Here it is k: ka, ki, ku, ke, ko.',
    sa:'The s row has one catch: the second one is “shi”, not “si”. Japanese has no “si” sound.',
    ta:'The t row has two catches: “chi” instead of “ti”, and “tsu” instead of “tu”.',
    na:'The n row is regular: na, ni, nu, ne, no. Watch ぬ and ね because they are easy to swap.',
    ha:'The h row has “fu” in the middle. It is a soft sound, halfway between f and h.',
    ma:'The m row: ma, mi, mu, me, mo. All five, no exceptions.',
    ya:'Only three here. Japanese dropped yi and ye centuries ago.',
    ra:'The r row sits between English r and l. Make it with a light tap of the tongue.',
    wa:'Two survivors and one special: ん is the only kana that is a consonant on its own.'
  };

  function scriptUnits(setName, set, wide, colors){
    var groups = [
      { id:'1', rows:['a','ka'],  glyph: setName==='hira' ? 'あ' : 'ア' },
      { id:'2', rows:['sa','ta'], glyph: setName==='hira' ? 'さ' : 'サ' },
      { id:'3', rows:['na','ha'], glyph: setName==='hira' ? 'な' : 'ナ' },
      { id:'4', rows:['ma','ya'], glyph: setName==='hira' ? 'ま' : 'マ' },
      { id:'5', rows:['ra','wa'], glyph: setName==='hira' ? 'ら' : 'ラ' }
    ];
    var label = setName==='hira' ? 'Hiragana' : 'Katakana';
    return groups.map(function(g, gi){
      var chars = flat(g.rows.map(function(r){ return set[r]; }));
      var steps = g.rows.map(function(rowKey){
        var row = set[rowKey];
        return {
          title: ROW_TITLES[rowKey] + ': ' + row.map(function(x){ return x.k; }).join(' '),
          body: ROW_BODY[rowKey],
          demo: function(){ return kanaGrid(row); },
          questions: 3,
          gens: [readGen(row, wide), writeGen(row, wide), typeGen(row)]
        };
      });
      return {
        id: setName + g.id,
        homeTab: setName,
        title: label + ' ' + g.id,
        blurb: chars.map(function(x){ return x.k; }).join(' '),
        color: colors[gi],
        icon: g.glyph,
        hint: chars.map(function(x){ return x.k + ' ' + x.r; }).join(' · '),
        steps: steps
      };
    });
  }

  var HIRA_COLORS = ['#d64a86','#c4478f','#a94a9c','#8b4faa','#6f52b8'];
  var KATA_COLORS = ['#3aa9c9','#3f9ec4','#4592bf','#4a86ba','#5079b5'];

  var UNITS = []
    .concat(scriptUnits('hira', HIRA, ALL_HIRA, HIRA_COLORS))
    .concat(scriptUnits('kata', KATA, ALL_KATA, KATA_COLORS));

  function fullScriptPractice(id, homeTab, title, blurb, color, icon, pool, wide){
    return {
      id:id, homeTab:homeTab, title:title, blurb:blurb, color:color, icon:icon,
      questionCount:pool.length,
      hint:'This run uses every character in the set once. Read it, find it, or type its sound; the order changes next time.',
      steps:[{ gens:[fullReadGen(pool, wide), fullWriteGen(pool, wide), fullTypeGen(pool)] }]
    };
  }

  UNITS.push(fullScriptPractice('hira-full', 'hira', 'Full Hiragana practice', 'all 46 characters, once each', '#d64a86', 'あ', ALL_HIRA, ALL_HIRA));
  UNITS.push(fullScriptPractice('kata-full', 'kata', 'Full Katakana practice', 'all 46 characters, once each', '#3aa9c9', 'ア', ALL_KATA, ALL_KATA));

  /* ================= WRITING ================= */
  function kanaWriteGen(pool){
    var x = pick(pool);
    return { type:'kanaWrite', tag:'write it', headlineHtml:'Write <span class="jp">' + x.k + '</span>.', sub:x.r + '.', kana:x.k, romaji:x.r, explain:'You wrote ' + x.k + ' in the expected stroke order. Its reading is ' + x.r + '.' };
  }
  function kanaWriteQuestion(x){
    return { type:'kanaWrite', tag:'Write it', headlineHtml:'Write <span class="jp">' + x.k + '</span>.', sub:x.r + '.', kana:x.k, romaji:x.r, explain:'You wrote ' + x.k + ' in the expected stroke order. Its reading is ' + x.r + '.' };
  }
  function fullKanaWriteGen(pool){ return cycle(pool, kanaWriteQuestion); }
  function kanaWritingType(area, q, api){
    var box=document.createElement('div'); box.className='writing';
    var stage=document.createElement('div'); stage.className='writer-stage locked';
    var host=document.createElement('div'); host.className='writerbox';
    var lockNote=document.createElement('div'); lockNote.className='writer-lock-note'; lockNote.textContent='Locked';
    var actions=document.createElement('div'); actions.className='writer-actions';
    var status=document.createElement('div'); status.className='writer-status'; status.textContent='Watch the order, then press Start drawing.';
    stage.appendChild(host); box.appendChild(stage); box.appendChild(lockNote); box.appendChild(actions); box.appendChild(status); area.appendChild(box);
    var writer=HanziWriter.create(host,q.kana,{width:270,height:270,padding:12,showOutline:true,showCharacter:false,strokeColor:'#f1f4fb',outlineColor:'#374154',drawingColor:'#d64a86',highlightColor:'#f2b94b',drawingWidth:26,drawingFadeDuration:900,charDataLoader:function(ch){return fetch('../assets/kana-data/'+encodeURIComponent(ch)+'.json').then(function(r){if(!r.ok)throw new Error('Kana data unavailable');return r.json();});}});
    var started=false, expectedStroke=0, memoryMode=localStorage.getItem('crowstudies:japanese:memory-writing')==='1';
    var promptHeading=area.querySelector('.qhead');
    function setMemoryMode(on){ memoryMode=on; memoryInput.checked=on; memoryState.textContent=on?'On':'Off'; localStorage.setItem('crowstudies:japanese:memory-writing',on?'1':'0'); if(promptHeading) promptHeading.hidden=on; if(on) writer.hideOutline({duration:0}); else writer.showOutline({duration:0}); }
    function setState(active){ stage.classList.toggle('locked',!active); stage.classList.toggle('ready',active); stage.classList.remove('watching'); lockNote.hidden=active; lockNote.textContent='Locked'; host.setAttribute('aria-disabled',active?'false':'true'); tryBtn.disabled=active; tryBtn.textContent=active?'Drawing active':'Start drawing'; hint.disabled=!active; memoryInput.disabled=active; }
    function start(){ if(started)return; started=true; expectedStroke=0; setState(true); status.textContent=memoryMode?'Memory mode: the character and outline are hidden. Draw the first stroke.':'Drawing is active. Draw the first stroke; the guide appears after one miss.'; writer.quiz({leniency:1.1,showHintAfterMisses:1,onMistake:function(){status.textContent='That is not the next stroke. Try again, or use Show next stroke.';},onCorrectStroke:function(info){expectedStroke=info.strokeNum+1;status.textContent='Stroke '+info.strokeNum+' is in. Keep going.';},onComplete:function(){status.textContent='Complete.';api.finish(true);}}); }
    var watch=document.createElement('button'); watch.className='btn ghost'; watch.textContent='Watch order';
    var tryBtn=document.createElement('button'); tryBtn.className='btn'; tryBtn.textContent='Start drawing';
    var hint=document.createElement('button'); hint.className='btn ghost'; hint.textContent='Show next stroke';
    var memoryToggle=document.createElement('label'); memoryToggle.className='memory-switch'; memoryToggle.innerHTML='<span class="memory-label">Practice from memory <small id="memory-state">Off</small></span><input type="checkbox" role="switch" aria-label="Practice from memory"><i aria-hidden="true"></i>';
    var memoryInput=memoryToggle.querySelector('input'), memoryState=memoryToggle.querySelector('#memory-state');
    watch.onclick=function(){writer.cancelQuiz();started=false;setState(false);stage.classList.add('watching');lockNote.textContent='Watching';status.textContent='Watch the sequence, then press Start drawing when you are ready.';writer.animateCharacter({strokeAnimationSpeed:1.2,delayBetweenStrokes:220});};
    tryBtn.onclick=start;
    hint.onclick=function(){if(!started)return;writer.highlightStroke(expectedStroke);status.textContent='The highlighted stroke is next.';};
    memoryInput.onchange=function(){if(started)return;setMemoryMode(memoryInput.checked);status.textContent=memoryMode?'Memory mode is on. Only the pinyin and meaning remain visible.':'Guided mode is on. The reference outline is visible.';};
    actions.appendChild(watch);actions.appendChild(tryBtn);actions.appendChild(hint);box.insertBefore(memoryToggle,stage);
    setMemoryMode(memoryMode);
    setState(false);
  }

  /* look-alikes */
  var TRAPS = [
    { a:find(ALL_KATA,'シ'), b:find(ALL_KATA,'ツ'),
      title:'シ shi vs ツ tsu',
      body:'The classic trap. In シ the marks sit low on the left and the long stroke sweeps UP from the bottom. In ツ the marks sit along the top and the long stroke comes DOWN. Their hiragana partners し and つ do the same thing.',
      note:'Trick: し sweeps up, so シ sweeps up. つ curls down, so ツ comes down.' },
    { a:find(ALL_KATA,'ソ'), b:find(ALL_KATA,'ン'),
      title:'ソ so vs ン n',
      body:'Same rule again. ン sweeps UP from the bottom left, like シ. ソ comes DOWN from the top, like ツ. Nothing else separates them.',
      note:'Group them: シ and ン sweep up. ツ and ソ come down.' },
    { a:find(ALL_KATA,'ク'), b:find(ALL_KATA,'ワ'),
      title:'ク ku vs ワ wa vs フ fu',
      body:'ク has a short cut across the top left. ワ is wide and square-shouldered. フ is a single bare hook with nothing on the left at all.',
      note:'Also compare ケ ke and タ ta, which reuse the same hook.' },
    { a:find(ALL_HIRA,'ね'), b:find(ALL_HIRA,'れ'),
      title:'ね ne vs れ re vs わ wa',
      body:'Identical on the left; the tail decides. ね curls into a full loop, れ hooks outward, わ closes into a round shoulder.',
      note:'Say it as: ne curls, re kicks out, wa rounds off.' },
    { a:find(ALL_HIRA,'る'), b:find(ALL_HIRA,'ろ'),
      title:'る ru vs ろ ro',
      body:'る finishes with a loop. ろ is the same road without it. The same distinction separates め and ぬ: ぬ has the loop, め does not.',
      note:'Loop present = ru and nu. Loop absent = ro and me.' },
    { a:find(ALL_HIRA,'さ'), b:find(ALL_HIRA,'き'),
      title:'さ sa vs き ki',
      body:'き has two crossbars, さ has one. は and ほ work the same way: ほ carries the extra bar.',
      note:'Count the bars before you guess.' }
  ];

  var TRAP_CHARS = TRAPS.reduce(function(a,t){ return a.concat([t.a, t.b]); }, [])
    .concat([find(ALL_HIRA,'わ'), find(ALL_HIRA,'ぬ'), find(ALL_HIRA,'め'),
             find(ALL_HIRA,'は'), find(ALL_HIRA,'ほ'), find(ALL_KATA,'フ')]);

  UNITS.push({
    id:'traps', homeTab:'compare', title:'Look-alikes', blurb:'the pairs everyone mixes up', color:'#e07b39',
    icon:'↔',
    hint:'シ and ン sweep up from the bottom left. ツ and ソ come down from the top. る/ぬ have loops, ろ/め do not. き and ほ carry an extra bar.',
    steps: TRAPS.map(function(t){
      var pool = [t.a, t.b];
      return {
        title: t.title,
        body: t.body,
        demo: function(){ return pairCard(t.a, t.b, t.note); },
        questions: 2,
        gens: [readGen(pool, TRAP_CHARS), writeGen(pool, TRAP_CHARS), typeGen(pool)]
      };
    })
  });

  var EVERY = ALL_HIRA.concat(ALL_KATA);

  function fullWritingPractice(id, title, blurb, color, icon, pool){
    return {
      id:id, homeTab:'writing', title:title, blurb:blurb, color:color, icon:icon,
      questionCount:pool.length,
      hint:'Every character in this set appears once. Watch its order first whenever you need a reminder, then draw it stroke by stroke.',
      steps:[{ gens:[fullKanaWriteGen(pool)] }]
    };
  }

  UNITS.push(fullScriptPractice('mixed', 'compare', 'All kana practice', 'all 92 characters, once each', '#ffb020', '<span class="script-pair">あア</span>', EVERY, EVERY));

  UNITS.push({
    id:'writing', homeTab:'writing', title:'Writing foundations', blurb:'learn the habits behind every kana', color:'#8b4faa',
    icon:'筆',
    hint:'Watch order first, then draw one stroke at a time. The checker expects the next stroke and compares your path with the reference, allowing small variations.',
    steps:[
      { title:'Writing is a sequence',
        body:'Kana are built from deliberate strokes in a conventional order. Learn that order before aiming for speed: it makes the character easier to remember and keeps its shape balanced.',
        demo:function(){ var d=document.createElement('div'); d.className='demo'; d.innerHTML='<strong>Four useful habits</strong><p class="cap">Work from top to bottom and left to right. Draw horizontal strokes before crossing vertical ones. Close boxes and enclosures last. Keep a steady direction and leave breathing room between strokes.</p>'; return d; },
        questions:0, gens:[] },
      { title:'Hiragana vowels', body:'Start with the five hiragana vowels. Focus on the order and direction of each stroke.', demo:function(){ return kanaGrid(HIRA.a); }, questions:3, gens:[function(){ return kanaWriteGen(HIRA.a); }] },
      { title:'Katakana vowels', body:'Then write the matching katakana vowels. Their straighter shapes make them a good contrast with hiragana.', demo:function(){ return kanaGrid(KATA.a); }, questions:3, gens:[function(){ return kanaWriteGen(KATA.a); }] }
    ]
  });

  UNITS.push(fullWritingPractice('hira-writing', 'Full Hiragana writing', 'write all 46 in stroke order', '#d64a86', 'あ', ALL_HIRA));
  UNITS.push(fullWritingPractice('kata-writing', 'Full Katakana writing', 'write all 46 in stroke order', '#3aa9c9', 'ア', ALL_KATA));
  UNITS.push(fullWritingPractice('all-writing', 'All kana writing', 'the complete 92-character writing run', '#ffb020', '<span class="script-pair">あア</span>', EVERY));

  /* ================= GO ================= */
  CrowQuiz({
    backLink:{ href:'../lessons/', label:'All lessons' },
    course:'japanese',
    title:'Japanese kana',
    tagline:'46 hiragana, 46 katakana, one row at a time',
    logo:'<span style="font-family:\'Noto Sans JP\',sans-serif;font-size:24px;font-weight:500">あ</span>',
    units:UNITS,
    homeTabs:[
      { id:'hira', label:'Hiragana' },
      { id:'kata', label:'Katakana' },
      { id:'compare', label:'Compare' },
      { id:'writing', label:'Writing' }
    ],
    types:{ kanaWrite:kanaWritingType },
    sounds:{ correct:chime, wrong:buzz, fanfare:fanfare },
    mixedCount:12
  }).start('#app');
})();
</script>
</body>
</html>
