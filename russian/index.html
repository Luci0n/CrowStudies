<script>(function(){'use strict';
var LETTERS=[{"l":"А","name":"a","sound":"a","say":"а"},{"l":"Б","name":"be","sound":"b","say":"бэ"},{"l":"В","name":"ve","sound":"v","say":"вэ"},{"l":"Г","name":"ge","sound":"g","say":"гэ"},{"l":"Д","name":"de","sound":"d","say":"дэ"},{"l":"Е","name":"ye","sound":"ye","say":"е"},{"l":"Ё","name":"yo","sound":"yo","say":"ё"},{"l":"Ж","name":"zhe","sound":"zh","say":"жэ"},{"l":"З","name":"ze","sound":"z","say":"зэ"},{"l":"И","name":"i","sound":"ee","say":"и"},{"l":"Й","name":"short i","sound":"y","say":"и краткое"},{"l":"К","name":"ka","sound":"k","say":"ка"},{"l":"Л","name":"el","sound":"l","say":"эл"},{"l":"М","name":"em","sound":"m","say":"эм"},{"l":"Н","name":"en","sound":"n","say":"эн"},{"l":"О","name":"o","sound":"o","say":"о"},{"l":"П","name":"pe","sound":"p","say":"пэ"},{"l":"Р","name":"er","sound":"rolled r","say":"эр"},{"l":"С","name":"es","sound":"s","say":"эс"},{"l":"Т","name":"te","sound":"t","say":"тэ"},{"l":"У","name":"u","sound":"oo","say":"у"},{"l":"Ф","name":"ef","sound":"f","say":"эф"},{"l":"Х","name":"kha","sound":"kh","say":"ха"},{"l":"Ц","name":"tse","sound":"ts","say":"цэ"},{"l":"Ч","name":"che","sound":"ch","say":"чэ"},{"l":"Ш","name":"sha","sound":"sh","say":"ша"},{"l":"Щ","name":"shcha","sound":"shch","say":"ща"},{"l":"Ъ","name":"hard sign","sound":"no sound","say":"твёрдый знак"},{"l":"Ы","name":"yery","sound":"y","say":"ы"},{"l":"Ь","name":"soft sign","sound":"no sound","say":"мягкий знак"},{"l":"Э","name":"e","sound":"e","say":"э"},{"l":"Ю","name":"yu","sound":"yu","say":"ю"},{"l":"Я","name":"ya","sound":"ya","say":"я"}];
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),v=a[i];a[i]=a[j];a[j]=v}return a}function groups(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
function hear(x){var b=el('button','speakbtn','Hear');b.type='button';b.onclick=function(){CrowSpeak(x.say,'ru-RU',0.78)};return b}

function readQ(pool){var x=pick(pool),o=shuffle([x].concat(shuffle(pool.filter(function(y){return y!==x})).slice(0,3)));return{type:'mcq',tag:'Read it',headlineHtml:'<div class="letter-prompt alpha">'+x.l+'</div>',sub:'Which letter is this?',speech:{text:x.say,lang:'ru-RU',rate:.78},choices:o.map(function(y){return y.name+' · '+y.sound}),correctIndex:o.indexOf(x),explain:x.l+' is '+x.name+', usually '+x.sound+'.'}}
function findQ(pool){var x=pick(pool),o=shuffle([x].concat(shuffle(pool.filter(function(y){return y!==x})).slice(0,3)));return{type:'mcq',tag:'Find it',headline:'Find '+x.name+'.',sub:'Its usual sound is '+x.sound+'.',speech:{text:x.say,lang:'ru-RU',rate:.78},choices:o.map(function(y){return y.l}),correctIndex:o.indexOf(x),bigChoices:true,explain:x.name+' is '+x.l+'.'}}
function typeQ(pool){var x=pick(pool);return{type:'type',tag:'Type it',headlineHtml:'<div class="letter-prompt alpha">'+x.l+'</div>',sub:'Type the letter name in English.',answer:x.name.toLowerCase(),alts:[x.name.toLowerCase()],placeholder:'e.g. alpha',speech:{text:x.say,lang:'ru-RU',rate:.78},explain:x.l+' is '+x.name+', usually '+x.sound+'.'}}
function cycleReview(pool){var order=[],i=0,mode=0;return function(){if(i>=order.length){order=shuffle(pool);i=0}var x=order[i++],q=mode++%3;if(q===0){var o=shuffle([x].concat(shuffle(pool.filter(function(y){return y!==x})).slice(0,3)));return{type:'mcq',tag:'Full alphabet',headlineHtml:'<div class="letter-prompt alpha">'+x.l+'</div>',sub:'Name this letter.',speech:{text:x.say,lang:'ru-RU',rate:.78},choices:o.map(function(y){return y.name+' · '+y.sound}),correctIndex:o.indexOf(x),explain:x.l+' is '+x.name+'.'}}if(q===1){var f=shuffle([x].concat(shuffle(pool.filter(function(y){return y!==x})).slice(0,3)));return{type:'mcq',tag:'Full alphabet',headline:'Find '+x.name+'.',sub:x.sound,choices:f.map(function(y){return y.l}),correctIndex:f.indexOf(x),bigChoices:true,explain:x.name+' is '+x.l+'.'}}return{type:'type',tag:'Full alphabet',headlineHtml:'<div class="letter-prompt alpha">'+x.l+'</div>',sub:'Type its English letter name.',answer:x.name.toLowerCase(),alts:[x.name.toLowerCase()],placeholder:'e.g. alpha',speech:{text:x.say,lang:'ru-RU',rate:.78},explain:x.l+' is '+x.name+'.'}}}
var colors=['#b36275','#a667b5','#6d7fc1','#578eae','#4c968e','#62955d'];
var units=groups(LETTERS,6).map(function(batch,i){return{id:'group-'+i,homeTab:'learn',title:'Letters '+(i*6+1)+'–'+Math.min((i+1)*6,LETTERS.length),blurb:batch.map(function(x){return x.l}).join(' '),color:colors[i%colors.length],icon:'<span class="alpha">'+batch[0].l+'</span>',hint:'Say the letter name, then its usual sound. Some letters resemble English letters but sound different, so trust the sound rather than the shape.',steps:[{title:'Meet these letters',body:'Listen to each letter before practicing. Keep the letter name and its most common sound together.',demo:function(){return grid(batch)},questions:4,gens:[function(){return readQ(batch)},function(){return findQ(batch)},function(){return typeQ(batch)}]}]}});units.push({id:'full',homeTab:'review',title:'Full Russian alphabet',blurb:'all '+LETTERS.length+' letters, once each',color:'#b36275',icon:'<span class="alpha">А</span>',questionCount:LETTERS.length,hint:'This run covers every letter exactly once. Use it after the groups feel familiar; listen whenever a name or sound slips.',steps:[{gens:[cycleReview(LETTERS)]}]});

}());</script></body></html>
