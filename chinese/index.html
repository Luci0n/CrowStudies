<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese foundations · CrowStudies</title>
<meta name="description" content="Learn Mandarin tones, useful radicals, starter Chinese characters, and stroke order through short drills.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=topography-20260912m">
<style>
  .zh{ font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  .disc{ font-family:"Noto Sans SC","Space Grotesk",sans-serif; font-size:25px; }
  .hanzi-card{ display:grid; grid-template-columns:100px 1fr; gap:16px; align-items:center; }
  .hanzi-card .glyph{ font:500 82px/1 "Noto Sans SC",sans-serif; color:var(--ink); text-align:center; }
  .hanzi-card .py{ font:650 24px/1.1 "Space Grotesk",sans-serif; color:var(--brand); }
  .hanzi-card .meaning{ margin-top:4px; font-size:19px; font-weight:750; }
  .hanzi-card .detail{ margin-top:8px; color:var(--ink-3); font-size:14px; line-height:1.45; }
  .tone-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .tone{ border:1px solid var(--line); background:var(--card); padding:10px 5px; text-align:center; }
  .tone b{ display:block; font:650 25px/1 "Space Grotesk",sans-serif; color:var(--brand); }
  .tone .tone-mark{ display:block; margin:5px 0 2px; color:var(--gold); font:650 38px/.8 "Space Grotesk",sans-serif; }
  .tone .tone-label{ display:block; color:var(--ink-3); font-size:11px; font-weight:700; }
  .hanzi-prompt{ font:500 104px/1 "Noto Sans SC",sans-serif; color:var(--ink); margin:0 0 12px; text-align:center; }
  .writing{ background:var(--well); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .writerbox{ width:270px; max-width:100%; margin:0 auto; touch-action:none; }
  .writerbox svg{ display:block; width:100%; height:auto; }
  .writer-status{ min-height:22px; text-align:center; color:var(--ink-3); font-size:14px; font-weight:700; margin:8px 0 0; }
  .writer-actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .writer-actions .btn{ width:auto; padding:11px 15px; font-size:14px; }
  .radical-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
  .radical-list div{ display:flex; flex-direction:column; align-items:flex-start; min-height:164px; background:var(--card); border:1px solid var(--line); padding:10px; }
  .radical-list b{ display:block; font:500 32px/1 "Noto Sans SC",sans-serif; color:var(--brand); }
  .radical-list .speakbtn{ margin:12px 0 0; margin-top:auto; }
  .hanzi-card .speakbtn{ grid-column:2; justify-self:start; margin:10px 0 0; }
  .radical-list span{ color:var(--ink-3); font-size:13px; font-weight:700; }
  @media(max-width:560px){ .hanzi-card{ grid-template-columns:82px 1fr; gap:10px; }.hanzi-card .glyph{ font-size:68px; }.tone-grid{ grid-template-columns:repeat(3,1fr); }.writerbox{ width:250px; } }
</style>
</head>
